name: gpu-monitor
version: 0.1.0
description: "NVIDIA GPU stats for the Hermes desktop status bar and the in-session /gpu command."
author: r.gonzalezgary@gmail.com
kind: standalone
provides_tools: []
manifest_version: 1
api_version: 1
config_schema:
  poll_seconds:
    type: int
    default: 2
    description: "How often the desktop requests GPU statistics (1-30 seconds)."
  vram_warn_percent:
    type: int
    default: 92
    description: "VRAM use (%) at which the status-bar chip switches to the accent color (50-100)."
  cli_command_enabled:
    type: bool
    default: true
    description: "Register the /gpu command in CLI and gateway sessions (restart required after changing)."
