# git-cliff configuration for the REPO-LEVEL changelog.
#
# Differs from cliff.toml (per-plugin) in three ways:
#   - no --include-path filter, so it spans every plugin;
#   - commit scope is shown, since a line could belong to any plugin;
#   - infrastructure commits (chore/ci/build/test) are KEPT -- this is the only
#     changelog they ever appear in, as they belong to no plugin.
#
# There is no repository version number, so headings are the plugin release
# tags in chronological order:
#   git-cliff --config cliff-repo.toml --tag-pattern '.*-v.*' -o CHANGELOG.md

[changelog]
header = """
# Repository changelog

Chronological history of this monorepo across every plugin release. Each
heading is a per-plugin release tag -- there is no repository version number.

For what changed in a plugin you installed, read that plugin's own
`CHANGELOG.md`. This file additionally records repo-level work (CI, licensing,
release tooling) that belongs to no single plugin.

Generated by [git-cliff](https://git-cliff.org) from commit history.
"""

body = """
{% if version %}\
## {{ version | replace(from="-v", to=" v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
split_commits = false
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  { pattern = '(?m) \(#[0-9]+\)$', replace = "" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(refactor|perf)", group = "<!-- 1 -->Changed" },
  { message = "^deprecate", group = "<!-- 2 -->Deprecated" },
  { message = "^remove", group = "<!-- 3 -->Removed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^security", group = "<!-- 5 -->Security" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^revert", group = "<!-- 7 -->Reverted" },
  { message = "^(chore|ci|build|test|style)", group = "<!-- 8 -->Maintenance" },
  { message = ".*", group = "<!-- 9 -->Uncategorized" },
]
