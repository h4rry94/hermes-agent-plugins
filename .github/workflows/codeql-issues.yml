name: Code Scanning issues

# Mirrors Code Scanning alerts on main into GitHub Issues so a finding shows up
# where work is triaged, not only in the Security tab. There is no workflow
# trigger for alert events (code_scanning_alert is webhook-only), so this runs
# after every CodeQL scan of main and reconciles: an open alert without an
# issue gets one, a fixed or dismissed alert gets its issue closed, and a
# reopened alert gets its issue reopened. PR-only findings never reach main's
# alert list, so they keep surfacing on the PR itself.
on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

concurrency:
  group: codeql-issues
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile alerts with issues
    # A failed scan leaves the alert list stale; reconciling against it would
    # close issues for alerts that are still there.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: security
      MARKER_PREFIX: "<!-- code-scanning-alert:"
    steps:
      - name: Ensure the label exists
        run: gh label create "$LABEL" --color b60205 --description "Code Scanning finding" --force

      - name: Reconcile
        run: |
          set -euo pipefail

          # Every alert on main, whatever its state, so fixed and dismissed ones
          # can close their issues.
          gh api --paginate "repos/${GH_REPO}/code-scanning/alerts?ref=refs/heads/main&per_page=100" \
            --jq '.[]' | jq -s '.' > alerts.json

          # Every issue this workflow has ever opened, keyed by alert number
          # from the marker in the body. Titles can be edited; the marker cannot.
          gh issue list --label "$LABEL" --state all --limit 1000 --json number,state,body \
            | jq --arg p "$MARKER_PREFIX" '
                map(select(.body | contains($p))
                    | {key: (.body | capture($p + "(?<n>[0-9]+)") .n), value: {number, state}})
                | from_entries' > issues.json

          jq -c '.[]' alerts.json | while read -r alert; do
            n="$(jq -r '.number' <<<"$alert")"
            state="$(jq -r '.state' <<<"$alert")"
            issue="$(jq -r --arg n "$n" '.[$n].number // empty' issues.json)"
            issue_state="$(jq -r --arg n "$n" '.[$n].state // empty' issues.json)"

            case "$state:$issue_state" in
              open:)
                url="$(jq -r '.html_url' <<<"$alert")"
                tool="$(jq -r '.tool.name' <<<"$alert")"
                rule_id="$(jq -r '.rule.id' <<<"$alert")"
                rule_desc="$(jq -r '.rule.description // .rule.id' <<<"$alert")"
                severity="$(jq -r '.rule.security_severity_level // .rule.severity' <<<"$alert")"
                path="$(jq -r '.most_recent_instance.location.path' <<<"$alert")"
                line="$(jq -r '.most_recent_instance.location.start_line' <<<"$alert")"
                sha="$(jq -r '.most_recent_instance.commit_sha' <<<"$alert")"
                body="$(cat <<EOF
          ${MARKER_PREFIX}${n} -->
          Code Scanning alert [#${n}](${url}) opened by ${tool}.

          | | |
          |---|---|
          | Rule | \`${rule_id}\` |
          | Severity | ${severity} |
          | Location | \`${path}:${line}\` |
          | Commit | ${sha} |

          This issue is closed automatically when the alert is fixed or dismissed.
          EOF
          )"
                echo "alert #${n}: opening issue"
                gh issue create --title "[${tool}] ${rule_desc} in ${path}" --body "$body" --label "$LABEL" </dev/null
                ;;
              open:CLOSED)
                echo "alert #${n}: reopening issue #${issue}"
                gh issue reopen "$issue" --comment "Code Scanning alert #${n} is open again." </dev/null
                ;;
              open:OPEN|*:CLOSED|*:)
                ;;
              *:OPEN)
                echo "alert #${n}: closing issue #${issue} (alert ${state})"
                gh issue close "$issue" --reason completed --comment "Code Scanning alert #${n} was marked ${state}." </dev/null
                ;;
            esac
          done
