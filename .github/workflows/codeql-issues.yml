name: Code Scanning issues

# Mirrors Code Scanning alerts into GitHub Issues so a finding shows up where
# work is triaged, not only in the Security tab. GitHub only emits this event
# for alerts on the default branch, so PR-only findings never become issues;
# they surface on the PR itself through the CodeQL workflow.
on:
  code_scanning_alert:
    types: [created, reopened, fixed, closed_by_user]

permissions:
  contents: read
  issues: write
  security-events: read

concurrency:
  # One alert at a time per number, so a created/fixed pair for the same
  # alert cannot race and leave two issues or a closed issue reopened.
  group: codeql-issue-${{ github.event.alert.number }}

jobs:
  mirror:
    name: "Alert #${{ github.event.alert.number }} → issue"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_NUMBER: ${{ github.event.alert.number }}
      ALERT_URL: ${{ github.event.alert.html_url }}
      ALERT_ACTION: ${{ github.event.action }}
      # Alert text is tool output, not author-controlled, but it still goes
      # through env rather than being interpolated into the script.
      RULE_ID: ${{ github.event.alert.rule.id }}
      RULE_DESC: ${{ github.event.alert.rule.description }}
      RULE_SEVERITY: ${{ github.event.alert.rule.severity }}
      SECURITY_SEVERITY: ${{ github.event.alert.rule.security_severity_level }}
      TOOL_NAME: ${{ github.event.alert.tool.name }}
      LOCATION_PATH: ${{ github.event.alert.most_recent_instance.location.path }}
      LOCATION_LINE: ${{ github.event.alert.most_recent_instance.location.start_line }}
      COMMIT_SHA: ${{ github.event.alert.most_recent_instance.commit_sha }}
    steps:
      - name: Find the issue for this alert
        id: find
        run: |
          # The marker in the body is the join key; titles can be edited.
          marker="<!-- code-scanning-alert:${ALERT_NUMBER} -->"
          number="$(gh issue list --state all --limit 200 --search "in:body \"${marker}\"" \
            --json number,body --jq "map(select(.body | contains(\"${marker}\"))) | .[0].number // empty")"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Open an issue
        if: (github.event.action == 'created' || github.event.action == 'reopened') && steps.find.outputs.number == ''
        run: |
          gh label create security --color b60205 --description "Code Scanning finding" --force
          title="[${TOOL_NAME}] ${RULE_DESC:-$RULE_ID} in ${LOCATION_PATH}"
          body="$(cat <<EOF
          <!-- code-scanning-alert:${ALERT_NUMBER} -->
          Code Scanning alert [#${ALERT_NUMBER}](${ALERT_URL}) opened by ${TOOL_NAME}.

          | | |
          |---|---|
          | Rule | \`${RULE_ID}\` |
          | Severity | ${SECURITY_SEVERITY:-${RULE_SEVERITY}} |
          | Location | \`${LOCATION_PATH}:${LOCATION_LINE}\` |
          | Commit | ${COMMIT_SHA} |

          This issue is closed automatically when the alert is fixed or dismissed.
          EOF
          )"
          gh issue create --title "${title}" --body "${body}" --label security

      - name: Reopen the issue
        if: github.event.action == 'reopened' && steps.find.outputs.number != ''
        run: gh issue reopen "${{ steps.find.outputs.number }}" --comment "Code Scanning alert #${ALERT_NUMBER} was reopened."

      - name: Close the issue
        if: (github.event.action == 'fixed' || github.event.action == 'closed_by_user') && steps.find.outputs.number != ''
        run: gh issue close "${{ steps.find.outputs.number }}" --reason completed --comment "Code Scanning alert #${ALERT_NUMBER} was marked ${ALERT_ACTION//_/ }."
