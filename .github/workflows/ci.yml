name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; the changelog preview raises its own scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIFF_VERSION: "2.13.1"

jobs:
  validate:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Plugin manifests
        run: python scripts/validate.py plugins

      # Stdlib unittest, no dependency install: the plugin Python halves have
      # no dependencies, so neither should testing them.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Byte-compile plugin Python
        run: |
          for manifest in */plugin.yaml; do
            plugin="$(dirname "$manifest")"
            echo "::group::compileall $plugin"
            python -m compileall -q "$plugin"
            echo "::endgroup::"
          done

  desktop:
    name: Desktop bundles
    # desktop/plugin.js is an esbuild artifact of desktop/plugin.tsx that has
    # to be committed - Hermes installs a plugin folder verbatim and never
    # runs a build. Rebuilding here and diffing is what keeps the file anyone
    # installs identical to the source anyone reviews.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version straight from package.json#packageManager,
      # so CI and a laptop cannot drift onto different pnpm releases.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pinned build toolchain
        run: pnpm install --frozen-lockfile

      - name: Type-check plugin sources and the build script
        run: pnpm check

      - name: Rebuild committed bundles
        run: pnpm build

      - name: Bundles match their sources
        run: |
          if ! git diff --exit-code -- '*/desktop/plugin.js'; then
            echo "::error::A committed desktop/plugin.js does not match a rebuild of its plugin.tsx. Run 'pnpm build' and commit the result."
            exit 1
          fi

  subject:
    name: PR title
    # The squash subject defaults to the PR title, and under generated
    # changelogs that string becomes the line an installing user reads.
    # It cannot be corrected once it is on main: force-push and non-linear
    # history are both blocked by the branch ruleset.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Conventional commit subject
        # Via env, never inlined into the shell: a PR title is attacker-controlled.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/validate.py subject "$PR_TITLE"

  changelog-preview:
    name: Changelog preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: git-cliff diffs against the last plugin tag.
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          base="https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}"
          asset="git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLo cliff.tar.gz "${base}/${asset}"
          curl -sSLo cliff.sha512 "${base}/${asset}.sha512"
          echo "$(cut -d' ' -f1 cliff.sha512)  cliff.tar.gz" | sha512sum -c -
          tar -xzf cliff.tar.gz -C /tmp
          sudo install -m 0755 /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          rm -f cliff.tar.gz cliff.sha512
          git-cliff --version

      - name: Render preview
        run: |
          {
            echo "<!-- changelog-preview -->"
            echo "### Changelog preview"
            echo
            echo "What this PR would add on release. These lines come from commit"
            echo "subjects, so they are what an installing user reads."
            echo
          } > preview.md

          found=0
          for manifest in */plugin.yaml; do
            plugin="$(dirname "$manifest")"
            section="$(git-cliff --config cliff.toml \
              --include-path "${plugin}/**" \
              --tag-pattern "${plugin}-v.*" \
              --unreleased 2>/dev/null || true)"
            # git-cliff still renders the "## [Unreleased]" heading when nothing
            # matched, so emptiness is decided by the presence of a bullet.
            if printf '%s\n' "$section" | grep -q '^- '; then
              found=1
              { echo "#### ${plugin}"; echo; echo '```markdown'; echo "$section"; echo '```'; echo; } >> preview.md
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "_No unreleased commits touch a plugin folder._" >> preview.md
          fi

          if grep -q "Uncategorized" preview.md; then
            {
              echo "> [!WARNING]"
              echo "> Commits landed under **Uncategorized** - they are not conventional"
              echo "> commits. \`release.py\` will refuse to release while they exist, and"
              echo "> they cannot be reworded once merged to main."
            } >> preview.md
          fi

          cat preview.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file preview.md --edit-last \
            || gh pr comment "$PR" --body-file preview.md
